<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoodie Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Hoodie Finder</h1>
    <p>Upload a photo of a look and find similar hoodies with prices.</p>
  </header>

  <section class="controls">
    <label class="upload">
      <input type="file" id="photo" accept="image/*">
      <span>Choose a photo</span>
    </label>
    <input type="number" id="maxPrice" placeholder="Max price £ (optional)">
    <select id="size">
      <option value="">Your size (optional)</option>
      <option>XS</option><option>S</option><option>M</option>
      <option>L</option><option>XL</option><option>XXL</option>
    </select>
    <button id="go">Find similar hoodies</button>
  </section>

  <p id="status"></p>

  <section class="analysis" id="analysis" hidden>
    <img id="preview" alt="Your photo">
    <div>
      <h2>What we found</h2>
      <ul id="attrs"></ul>
    </div>
  </section>

  <section id="results" class="grid"></section>

  <script src="js/app.js"></script>
</body>
</html>
